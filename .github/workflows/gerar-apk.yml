name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Explorador-XP-0.1.0-alpha.1.apk

      - name: Atualizar tag de desenvolvimento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f explorador-xp-dev
          git push origin -f explorador-xp-dev

      - name: Publicar APK direto na prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view explorador-xp-dev >/dev/null 2>&1 || \
            gh release create explorador-xp-dev --title "Explorador XP - Desenvolvimento" --prerelease --notes "Build de desenvolvimento atual."
          gh release upload explorador-xp-dev Explorador-XP-0.1.0-alpha.1.apk --clobber
