name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Testar
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Analisar lint
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          LINT_STATUS=$?
          if [ "$LINT_STATUS" -ne 0 ]; then
            echo "::group::Relatório completo do Android Lint"
            LINT_REPORT=$(find app/build -type f -name 'lint-results-debug.txt' -print -quit)
            if [ -n "$LINT_REPORT" ] && [ -f "$LINT_REPORT" ]; then
              cat "$LINT_REPORT"
            else
              echo "Relatório textual do lint não encontrado."
            fi
            echo "::endgroup::"
            exit "$LINT_STATUS"
          fi

      - name: Liberar KVM para Baseline Profile
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Gerar Baseline Profile dos caminhos críticos
        run: >-
          gradle :app:generateBaselineProfile
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
          --stacktrace

      - name: Gerar APK otimizado de desempenho
        run: gradle :app:assemblePerformance --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION"
          APK_NAME="Explorador-XP-${APP_VERSION}-performance.apk"
          cp app/build/outputs/apk/performance/app-performance.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Atualizar tag de desenvolvimento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f explorador-xp-dev
          git push origin -f explorador-xp-dev

      - name: Publicar APK direto na prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view explorador-xp-dev >/dev/null 2>&1 || \
            gh release create explorador-xp-dev --title "Explorador XP - Desenvolvimento" --prerelease --notes "Build de desenvolvimento otimizada para teste de desempenho."
          gh release upload explorador-xp-dev "$APK_NAME" --clobber
